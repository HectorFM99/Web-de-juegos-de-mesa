name: Build container

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    name: Build the website image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag la-sobremesa:${{ github.sha }} .
