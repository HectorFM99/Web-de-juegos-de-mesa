<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f5f0e5">
    <meta name="description" content="Accede a tu cuenta en La Sobremesa.">
    <title>Acceso — La Sobremesa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
    <script src="../js/theme.js" defer></script>
    <style>
      .auth-wrap {
        min-height: calc(100vh - 76px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .auth-card {
        background: var(--paper2);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 48px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 10px 30px rgba(36, 38, 30, 0.04);
      }
      .auth-tabs {
        display: flex;
        gap: 20px;
        margin-bottom: 32px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
      }
      .auth-tab {
        background: none;
        border: none;
        font: 600 14px var(--display);
        color: var(--muted);
        cursor: pointer;
        padding: 0;
        transition: color 0.2s;
      }
      .auth-tab.active {
        color: var(--rust);
        border-bottom: 2px solid var(--rust);
        padding-bottom: 10px;
        margin-bottom: -13px;
      }
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .form-group label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: var(--ink);
      }
      .form-group input {
        font: 13px var(--sans);
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 12px 14px;
        border-radius: 3px;
        outline: none;
        transition: border-color 0.2s;
      }
      .form-group input:focus {
        border-color: var(--green);
      }
      .auth-submit {
        margin-top: 8px;
        width: 100%;
        justify-content: center;
        cursor: pointer;
      }
      .auth-footer {
        margin-top: 24px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      .auth-footer a {
        color: var(--rust);
        font-weight: 650;
      }
      .form-section {
        display: none;
      }
      .form-section.active {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="../index.html">
        <span class="brand-mark">✳</span>
        <span>la sobremesa<small>JUEGOS PARA COMPARTIR</small></span>
      </a>
      <nav class="main-nav">
        <a href="../index.html#juegos">Juegos</a>
        <a href="../index.html#como-funciona">Cómo funciona</a>
        <a href="../index.html#sobre-nosotros">La idea</a>
      </nav>
      <button class="theme-toggle" type="button" aria-pressed="false"><span aria-hidden="true">☾</span> Modo oscuro</button>
    </header>

    <main class="auth-wrap">
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" type="button" id="tab-login" onclick="switchTab('login')">Iniciar Sesión</button>
          <button class="auth-tab" type="button" id="tab-register" onclick="switchTab('register')">Crear Cuenta</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form form-section active" id="form-login" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-email">Correo electrónico</label>
            <input type="email" id="login-email" required placeholder="tu@correo.com">
          </div>
          <div class="form-group">
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" required placeholder="••••••••">
          </div>
          <button type="submit" class="button button-dark auth-submit">
            Entrar a la partida <span>→</span>
          </button>
        </form>

        <!-- Register Form -->
        <form class="auth-form form-section" id="form-register" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="reg-username">Nombre de usuario</label>
            <input type="text" id="reg-username" required placeholder="jugador123">
          </div>
          <div class="form-group">
            <label for="reg-email">Correo electrónico</label>
            <input type="email" id="reg-email" required placeholder="tu@correo.com">
          </div>
          <div class="form-group">
            <label for="reg-password">Contraseña</label>
            <input type="password" id="reg-password" required placeholder="••••••••">
          </div>
          <button type="submit" class="button button-dark auth-submit">
            Registrarse y jugar <span>→</span>
          </button>
        </form>

        <div class="auth-footer" id="auth-footer-text">
          ¿Aún no tienes cuenta? <a href="#" onclick="switchTab('register'); return false;">Regístrate aquí</a>
        </div>
      </div>
    </main>

    <script>
      // Redirect to index if already authenticated
      if (localStorage.getItem('sobremesa_user')) {
        window.location.href = '../index.html';
      }

      function switchTab(tab) {
        const loginForm = document.getElementById('form-login');
        const registerForm = document.getElementById('form-register');
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const footerText = document.getElementById('auth-footer-text');

        if (tab === 'login') {
          loginForm.classList.add('active');
          registerForm.classList.remove('active');
          tabLogin.classList.add('active');
          tabRegister.classList.remove('active');
          footerText.innerHTML = '¿Aún no tienes cuenta? <a href="#" onclick="switchTab(\'register\'); return false;">Regístrate aquí</a>';
        } else {
          registerForm.classList.add('active');
          loginForm.classList.remove('active');
          tabRegister.classList.add('active');
          tabLogin.classList.remove('active');
          footerText.innerHTML = '¿Ya tienes cuenta? <a href="#" onclick="switchTab(\'login\'); return false;">Inicia sesión aquí</a>';
        }
      }

      async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        try {
          const res = await fetch('http://localhost:3000/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();

          if (!res.ok) {
            alert(Array.isArray(data.message) ? data.message.join(', ') : (data.message || 'Error al iniciar sesión.'));
            return;
          }

          localStorage.setItem('sobremesa_user', JSON.stringify(data.user));
          if (data.access_token) {
            localStorage.setItem('sobremesa_token', data.access_token);
          }
          window.location.href = '../index.html';
        } catch (err) {
          // Fallback for offline/static preview
          localStorage.setItem('sobremesa_user', JSON.stringify({ email }));
          window.location.href = '../index.html';
        }
      }

      async function handleRegister(e) {
        e.preventDefault();
        const username = document.getElementById('reg-username').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        try {
          const res = await fetch('http://localhost:3000/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
          });

          const data = await res.json();

          if (!res.ok) {
            alert(Array.isArray(data.message) ? data.message.join(', ') : (data.message || 'Error al registrarse.'));
            return;
          }

          localStorage.setItem('sobremesa_user', JSON.stringify(data.user));
          if (data.access_token) {
            localStorage.setItem('sobremesa_token', data.access_token);
          }
          window.location.href = '../index.html';
        } catch (err) {
          // Fallback for offline/static preview
          localStorage.setItem('sobremesa_user', JSON.stringify({ username, email }));
          window.location.href = '../index.html';
        }
      }
    </script>
  </body>
</html>
