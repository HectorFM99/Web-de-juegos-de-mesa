user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- CONFIDENTIALITY: Hide server version fingerprinting ---
    server_tokens off;

    # --- AVAILABILITY: Rate limiting zone (prevent DoS / flooding) ---
    limit_req_zone $binary_remote_addr zone=web_limit:10m rate=15r/s;

    # --- AVAILABILITY: Timeout & body size limits (prevent Slowloris / payload abuse) ---
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    client_max_body_size 2M;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Apply rate limiting
        limit_req zone=web_limit burst=30 nodelay;

        # --- CONFIDENTIALITY & INTEGRITY: Security Headers ---
        # Mismos valores que aplica Helmet en el backend (backend/src/security.ts).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header X-Download-Options "noopen" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Origin-Agent-Cluster "?1" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # CSP en el formato de Helmet (sus directivas por defecto + las necesarias para esta web).
        # Sin 'unsafe-inline': no hay <script>, onclick/onsubmit, <style> ni style="" en el HTML.
        #  - connect-src: el frontend llama a la API en el puerto 3000.
        #  - fonts.googleapis.com / fonts.gstatic.com: Google Fonts.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000; font-src 'self' https://fonts.gstatic.com data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Cache static assets efficiently.
        # Sin add_header aquí: en nginx, un add_header dentro de un location anula todas las
        # cabeceras de seguridad del server. "expires" ya envía Cache-Control: max-age.
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
            expires 30d;
        }
    }
}
