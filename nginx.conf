user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- CONFIDENTIALITY: Hide server version fingerprinting ---
    server_tokens off;

    # --- AVAILABILITY: Rate limiting zone (prevent DoS / flooding) ---
    limit_req_zone $binary_remote_addr zone=web_limit:10m rate=15r/s;

    # --- AVAILABILITY: Timeout & body size limits (prevent Slowloris / payload abuse) ---
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    client_max_body_size 2M;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Apply rate limiting
        limit_req zone=web_limit burst=30 nodelay;

        # --- CONFIDENTIALITY & INTEGRITY: Security Headers ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none';" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Cache static assets efficiently
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
