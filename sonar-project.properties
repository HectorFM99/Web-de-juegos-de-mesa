# Identificador del proyecto en la instancia de SonarQube.
sonar.projectKey=HectorFM99_Web-de-juegos-de-mesa
sonar.organization=hectorfm99

# Qué se analiza y qué no
sonar.sources=.
sonar.exclusions=node_modules/**,tests/**,eslint.config.mjs
sonar.tests=tests

# Dónde está el informe de cobertura de los tests
sonar.javascript.lcov.reportPaths=lcov.info

# Evitar que se cuente la cobertura de los tests
sonar.coverage.exclusions=**

# Esperar al Quality Gate y fallar si no se cumple
sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8
