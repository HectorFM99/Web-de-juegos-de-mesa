# Identificador del proyecto en SonarCloud.
sonar.projectKey=HectorFM99_Web-de-juegos-de-mesa
sonar.projectName=HectorFM99_Web-de-juegos-de-mesa
sonar.organization=hectorfm99

# Qué se analiza y qué no
sonar.sources=js,index.html,backend/src
sonar.tests=tests,backend/src
sonar.test.inclusions=tests/**/*.js,backend/src/**/*.spec.ts
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,Microsoft/**,Dockerfile,compose.yaml,README.md,css/**,html/**,.github/**

# Cobertura de código (frontend + backend)
sonar.javascript.lcov.reportPaths=coverage/lcov.info,backend/coverage/lcov.info

# Esperar al Quality Gate y fallar si no se cumple
sonar.qualitygate.wait=true
