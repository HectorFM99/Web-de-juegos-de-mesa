# Identificador del proyecto en SonarCloud.
sonar.projectKey=HectorFM99_Web-de-juegos-de-mesa
sonar.projectName=HectorFM99_Web-de-juegos-de-mesa
sonar.organization=hectorfm99

# Qué se analiza y qué no
sonar.sources=js,css,html,index.html
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,Microsoft/**,Dockerfile,compose.yaml,README.md

# Cobertura de código
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Esperar al Quality Gate y fallar si no se cumple
sonar.qualitygate.wait=true
